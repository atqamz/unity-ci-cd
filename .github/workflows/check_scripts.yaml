name: Check scripts

on:
  pull_request:
    paths:
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Script contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Run fixture tests
        run: for test in .github/scripts/test_*.sh; do bash "$test"; done

      - name: Shellcheck
        run: shellcheck .github/scripts/*.sh

      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
